name: Event quality regression tests
on:
  push:
    branches: [map-performance-preview]
  pull_request:
    paths:
      - 'WADUP/lib/**'
      - 'WADUP/tests/**'
      - 'WADUP/pages/**'
permissions:
  contents: read
jobs:
  event-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test WADUP/tests/event-quality.test.mjs

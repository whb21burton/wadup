name: Wadup category taxonomy lock
on:
  pull_request:
    paths:
      - 'WADUP/lib/data.js'
      - 'WADUP/scripts/check-category-lock.cjs'
      - '.github/workflows/category-lock.yml'
  push:
    branches: [main]
    paths:
      - 'WADUP/lib/data.js'
      - 'WADUP/scripts/check-category-lock.cjs'
      - '.github/workflows/category-lock.yml'
jobs:
  taxonomy-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node WADUP/scripts/check-category-lock.cjs
